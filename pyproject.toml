[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-dt"
version = "0.1.0"
description = "AI Rocket Propulsion / 6-DoF Attitude Control / VTVL Digital Twin (Clean-v0, P0 slice)"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "pyyaml==6.0.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
cea = ["cea==3.3.4"]

[project.scripts]
rocket-dt = "rocket_dt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
